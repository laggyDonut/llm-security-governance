name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Minimal permissions for security
permissions:
  contents: read

jobs:
  test:
    name: Run Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with pytest
        run: |
          python -m pytest detection/test_examples.py -v --tb=short

  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    # Continue on error to report lint issues without blocking CI
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff linter
        run: |
          ruff check detection/ --output-format=github

      - name: Run Ruff formatter check
        run: |
          ruff format --check detection/
