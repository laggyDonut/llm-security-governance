[project]
name = "llm-security-governance"
version = "0.1.0"
description = "Governance-first analysis of LLM jailbreak risks (OWASP LLM Top 10 2025) with Python PoC detector + EU compliance mapping (GDPR, NIS2, EU AI Act)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = [
    "llm",
    "security",
    "jailbreak",
    "governance",
    "owasp",
    "eu-ai-act",
    "nis2",
    "gdpr",
    "compliance",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# No runtime dependencies — stdlib only
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.4.0",
]

[project.urls]
"Homepage" = "https://github.com/laggyDonut/llm-security-governance"
"Bug Tracker" = "https://github.com/laggyDonut/llm-security-governance/issues"

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["detection*"]

[tool.pytest.ini_options]
testpaths = ["detection"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["detection"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["detection"]
